<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Leave - SLMS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h1 { color:#333; font-size: 28px; margin-bottom: 6px; }
        p { color:#666; font-size: 14px; margin-bottom: 20px; }
        form { margin-top: 10px; }
        .field { margin-bottom: 16px; }
        label { display:block; color:#333; font-weight: 800; font-size: 14px; margin-bottom: 8px; }
        input[type="date"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        textarea { min-height: 110px; resize: vertical; }
        .btn-row { display:flex; gap: 12px; flex-wrap: wrap; }
        button[type="submit"], a.btn {
            padding: 11px 16px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            text-decoration:none;
            border: none;
        }
        button[type="submit"] { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        a.btn { background: #eee; color: #333; border: 1px solid #ddd; }
        .error { background:#f8d7da; color:#721c24; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
        .success { background:#d4edda; color:#155724; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Apply Leave</h1>
    <p>Fill in the details and submit your leave request.</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% if success %}<div class="success">{{ success }}</div>{% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="field">
            <label for="from_date">From Date</label>
            <input type="date" id="from_date" name="from_date" required>
        </div>

        <div class="field">
            <label for="to_date">To Date</label>
            <input type="date" id="to_date" name="to_date" required>
        </div>

        <div class="field">
            <label for="reason">Reason</label>
            <textarea id="reason" name="reason" placeholder="Enter reason" required></textarea>
        </div>

        <div class="btn-row">
            <button type="submit">Submit Leave</button>
            <a class="btn" href="{% url 'staff_dashboard' %}">Back</a>
        </div>
    </form>
</div>
</body>
</html>
