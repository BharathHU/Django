<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - SLMS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: whitesmoke;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            color: white;
            padding: 40px;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .hero {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 80px 60px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.25);
            max-width: 700px;
            width: 100%;
            animation: slideInUp 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 64px;
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #333333 0%, #555555 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInDown 0.8s ease-out 0.2s both;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 50px;
            opacity: 0.95;
            font-weight: 300;
            letter-spacing: 1px;
            animation: fadeInUp 0.8s ease-out 0.4s both;
            color: #444444;
        }

        .tagline {
            display: inline-block;
            background: rgba(102, 126, 234, 0.15);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 13px;
            margin-bottom: 25px;
            letter-spacing: 1px;
            animation: fadeInDown 0.8s ease-out 0.15s both;
            border: 1px solid rgba(102, 126, 234, 0.4);
            text-transform: uppercase;
            font-weight: 600;
            color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .button-group a {
            display: inline-block;
            padding: 16px 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.3);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button-group a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.4s ease;
            z-index: -1;
        }

        .button-group a:first-child {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid white;
            color: white;
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.3);
        }

        .button-group a:last-child {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .button-group a:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 25px 50px rgba(102, 126, 234, 0.5);
        }

        .button-group a:hover::before {
            left: 100%;
        }

        .button-group a:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* Icon or decoration */
        .icon-circle {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
            font-size: 50px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .footer {
            position: fixed;
            bottom: 25px;
            width: 100%;
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            letter-spacing: 0.5px;
            z-index: 1;
        }

        .footer p {
            margin: 0;
            animation: fadeIn 1.2s ease-out 1s both;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(60px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero {
                padding: 60px 40px;
                border-radius: 25px;
            }

            .hero h1 {
                font-size: 48px;
                letter-spacing: 2px;
            }

            .hero p {
                font-size: 18px;
            }

            .button-group {
                flex-direction: column;
                gap: 18px;
            }

            .button-group a {
                width: 100%;
                padding: 15px 40px;
            }

            .tagline {
                font-size: 12px;
            }

            .icon-circle {
                width: 100px;
                height: 100px;
                font-size: 40px;
                margin-bottom: 25px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px;
            }

            .container {
                padding: 20px;
            }

            .hero {
                padding: 45px 25px;
                border-radius: 20px;
            }

            .hero h1 {
                font-size: 36px;
                letter-spacing: 1px;
                margin-bottom: 12px;
            }

            .hero p {
                font-size: 16px;
                margin-bottom: 35px;
            }

            .button-group {
                gap: 12px;
            }

            .button-group a {
                padding: 13px 30px;
                font-size: 14px;
                letter-spacing: 0.5px;
            }

            .tagline {
                font-size: 11px;
                padding: 7px 15px;
            }

            .icon-circle {
                width: 90px;
                height: 90px;
                font-size: 35px;
                margin-bottom: 20px;
            }

            .footer {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <div class="hero-content">
                <div class="icon-circle">📋</div>
                <div class="tagline">Welcome to SLMS</div>
                <h1>SLMS</h1>
                <p>Staff Leave Management System</p>
                <div class="button-group">
                    <a href="{% url 'login' %}">Login</a>
                    <a href="{% url 'register' %}">Register</a>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>© Copyright 2026 Bharath H U | All rights Reserved</p>
    </footer>
</body>
</html>
