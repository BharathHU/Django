{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/style.css'%}">
</head>
<body id="body">
    <center><h1>{{name}}'s Favourite</h1></center>
    <div>
        <h2>Fav bird:{{bird}}</h2>
        <h2><a href="https:/en.wikipedia.org/wiki/Peafowl">click here to know</a></h2>
        <img src="{% static 'image/peacock.jpg' %}" id="img" height="300px" width="300px">
    </div>
    <div>
        <h2>Fav animal:{{animal}}</h2>
        <h2><a href="https:/en.wikipedia.org/wiki/lion">click here to know</a></h2>
        <img src="{% static 'image/Lion.jpg' %}" id="img">
    </div>
    <div>
        <h2>Fav dish:{{dish}}</h2>
        <h2><a href="https:/en.wikipedia.org/wiki/biryani">click here to know</a></h2>
        <img src="{% static 'image/dish.jpg' %}" id="img">
    </div>
</body>
</html>
