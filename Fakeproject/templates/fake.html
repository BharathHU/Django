<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            transition:0.5s;
            transform:scale(1.2);
             animation: ani1 8s infinite;
             animation-timing-function: ease-in-out;
             animation-direction:alternate;
             ANIMATION-ITERATION-COUNT:INFINITE;
             text-shadow:5px 1px 2px  whitesmoke;

        }
        *{
            background-color: lightblue;

        }
        table {
            width: 80%;
            border-collapse: collapse;
            box-shadow:0px 1px 2px 1px black;
            height:50%;

            border-radius: 20px;
            /* animation:ani 8s infinite; */
            animation-timing-function: ease-in-out;
            animation-direction:alternate;
            ANIMATION-ITERATION-COUNT:INFINITE;
           

        }
        table:hover{
            box-shadow:0px 0px 5px 3px black;
            transition:0.5s;
            transform:scale(1.05);
            border-radius: 20px;
            animation: none;
        }
        th, td {
            padding: 8px;
            text-align: left;
             background-color:whitesmoke;
             /* animation:ani1 8s infinite; */
             animation-timing-function: ease-in-out;
                animation-direction:alternate;

        }
        @keyframes ani1{
            0%{
color:rgb(2, 19, 25);
color: white;
            }
            10%{
        color:lightcoral;
            }
            20%{
color:lightgreen;
            }
            30%{
color:magenta;
            }
            40%{
  color:yellow;
            }
            50%{
 color:orange;
            }
            60%{
                 color:cyan;
            }
            70%{
                color:pink;
            }
            80%{
color:lightgray;

            }
            90%{
color:rgb(16, 113, 241);
color: white;
            }
            100%{
               color:tomato;
            }
        }
        @keyframes ani{
            0%{
                transform:scale(1);
                
                
                
            }
            10%{
                transform:scale(1.1);
                
                
            }
            20%{
                transform:scale(1.1);
                
            }
            30%{
                transform:scale(1);
                
            }
            40%{
                transform:scale(1);
                   
            }
            50%{
                transform:scale(1.1);
                   
            }
            60%{
                transform:scale(1.1);
                   
            }
            70%{
                transform:scaleX(1.2);
                
            }
            80%{
                transform:scaley(1.2);
                
            }
            100%{
                transform:scale(1);
                
            }









        }

    </style>
</head>
<body>
    <center><h1>Employee Details</h1>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Place</th>
            <th>Position</th>
            <th>Salary</th>

        </tr>
        {% for employee in employees %}
        <tr>
            <td>{{ employee.name }}</td>
            <td>{{ employee.email }}</td>
            <td>{{ employee.department }}</td>
            <td>{{ employee.place }}</td>
            <td>{{ employee.position }}</td>
            <td>{{ employee.salary }}</td>  


        </tr>
        {% endfor %}
        </table>

    </center>
</body>
</html>
